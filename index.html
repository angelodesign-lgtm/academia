<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071421">
<link rel="manifest" href="manifest.json">
<title>SkyFit Treinos</title>
<style>
:root{--bg:#06111d;--card:#0d2031;--card2:#10283b;--text:#f4f8fb;--muted:#91a5b7;--blue:#1595ff;--green:#35d07f;--orange:#ffad35;--red:#ff5470;--line:#1d374c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111d,#081827);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:82px}.top{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.brand span{color:var(--blue)}.sub{color:var(--muted);font-size:12px;margin-top:2px}
main{padding:0 16px}.hero{border:1px solid var(--line);background:radial-gradient(circle at 90% 10%,#124a72,#0b2132 48%,#0b1825);border-radius:20px;padding:20px;margin-bottom:14px}.hero h1{margin:0 0 7px;font-size:26px}.hero p{margin:0;color:#b9c8d4}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:800;color:white;background:var(--blue)}.btn.secondary{background:#183249}.btn.full{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{font-size:23px;display:block}.stat span{color:var(--muted);font-size:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h2{font-size:17px;margin:0}.muted{color:var(--muted)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:12px}.day-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#123451;font-size:20px}.day h3{margin:0 0 3px;font-size:15px}.day p{margin:0;color:var(--muted);font-size:12px}.day .arrow{margin-left:auto;color:var(--muted)}
.exercise{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}.ex-top{display:flex;gap:12px;align-items:center}.ex-img{width:72px;height:62px;border-radius:12px;background:#132d42;display:grid;place-items:center;overflow:hidden}.ex-img svg{width:58px;height:50px}.ex-name{font-weight:800}.tag{display:inline-block;font-size:10px;color:#9ed6ff;background:#103452;border-radius:20px;padding:4px 7px;margin-top:5px}.presc{margin-top:10px;color:#b8c7d2;font-size:13px}.open{margin-top:10px}
.back{background:none;border:0;color:#bcd0df;padding:5px 0;font-weight:700}.screen-title{font-size:24px;margin:10px 0 4px}.screen-sub{color:var(--muted);margin:0 0 16px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.setrow{display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:7px;align-items:center;margin-bottom:7px}.setnum{font-weight:800;text-align:center;color:#8fb4cd}.field{width:100%;background:#081827;border:1px solid #29465b;color:white;border-radius:10px;padding:10px}.check{height:42px;width:42px;border-radius:10px;border:1px solid #31566e;background:#102b3e;color:#79a8c3;font-weight:900}.check.done{background:#0c5b3a;border-color:#35d07f;color:#35d07f}.progress-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}.chart{width:100%;height:190px;background:#091a29;border-radius:12px;padding:8px}.chart svg{width:100%;height:100%}.history{border-left:3px solid var(--blue);padding:10px 12px;background:var(--card);border-radius:0 12px 12px 0;margin-bottom:8px}.history b{font-size:14px}.history small{display:block;color:var(--muted);margin-top:4px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);height:70px;background:rgba(5,16,27,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}nav button{border:0;background:none;color:#7790a2;font-weight:700;font-size:11px}nav button.active{color:#fff}nav .ico{display:block;font-size:20px;margin-bottom:3px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#15364b;border:1px solid #2e5d78;padding:11px 15px;border-radius:12px;display:none;z-index:30;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}.danger{color:#ff8294}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">S<span>ky</span>Fit</div><div class="sub">Treinos • Hipertrofia</div></div><div id="todayBadge" class="tag"></div></header>
<main id="app"></main>
<nav>
<button data-tab="home"><span class="ico">⌂</span>Início</button>
<button data-tab="treinos"><span class="ico">🏋</span>Treinos</button>
<button data-tab="progresso"><span class="ico">↗</span>Progresso</button>
</nav>
<div class="toast" id="toast"></div>
</div>
<script>
const workouts={
"2° Feira":{title:"Peito + Ombros + Tríceps",icon:"🔴",ex:[
["Supino Reto Barra","Peito",4,"6–8"],["Supino Inclinado H
alteres","Peito",3,"8–10"],["Crucifixo Fly","Peito",3,"10–12"],["Crossover Polia","Peito",2,"12–15"],["Desenvolvimento na Máquina/Halteres","Ombros",3,"8–10"],["Elevação Lateral","Ombros",4,"10–15"],["Tríceps na Polia","Tríceps",3,"10–12"],["Tríceps Francês","Tríceps",3,"10–12"]]},
"3° Feira":{title:"Costas + Bíceps",icon:"🔵",ex:[
["Puxada Alta Pronada","Costas",4,"8–10"],["Remada Baixa","Costas",3,"8–10"],["Remada Unilateral Halter","Costas",3,"10–12"],["Puxada Alta Neutra","Costas",3,"10–12"],["Pullover na polia","Costas",2,"12–15"],["Crucifixo inverso","Ombros",3,"12–15"],["Rosca direta","Bíceps",3,"8–10"],["Rosca alternada","Bíceps",3,"10–12"],["Rosca martelo","Bíceps",2,"10–12"]]},
"4° Feira":{title:"Pernas A • Quadríceps",icon:"🟢",ex:[
["Agachamento Livre ou Smith","Quadríceps",4,"6–8"],["Leg Press 45°","Quadríceps",4,"8–10"],["Cadeira extensora","Quadríceps",3,"10–15"],["Afundo/Búlgaro","Quadríceps",3,"8–12"],["Mesa flexora","Posteriores",3,"10–12"],["Panturrilha em pé","Panturrilhas",4,"10–15"],["Panturrilha sentado","Panturrilhas",3,"12–15"],["Crunch na máquina","Abdômen",3,"12–15"],["Elevação de pernas","Abdômen",3,"10–15"]]},
"6° Feira":{title:"Upper • Peito + Costas + Braços",icon:"🟠",ex:[
["Supino inclinado na máquina","Peito",3,"8–10"],["Crossover","Peito",3,"10–15"],["Puxada alta","Costas",3,"8–10"],["Remada articulada/máquina","Costas",3,"8–12"],["Desenvolvimento na máquina","Ombros",3,"8–10"],["Elevação lateral","Ombros",3,"12–15"],["Rosca Scott","Bíceps",3,"10–12"],["Tríceps corda","Tríceps",3,"10–12"]]},
"SÁBADO":{title:"Pernas B • Posterior + Glúteos",icon:"🟣",ex:[
["Stiff / Romanian Deadlift","Posteriores",4,"6–10"],["Mesa flexora","Posteriores",4,"8–12"],["Hip thrust","Glúteos",4,"8–12"],["Leg Press","Quadríceps",3,"10–12"],["Cadeira Extensora","Quadríceps",3,"12–15"],["Cadeira Abdutora","Glúteos",3,"12–15"],["Panturrilha em Pé/Máquina","Panturrilhas",4,"10–15"],["Crunch na Polia","Abdômen",3,"10–15"],["Prancha","Abdômen",3,"30–60s"]]}
};
const rest=["Quinta","Domingo"];
let data=JSON.parse(localStorage.getItem("skyfit_v1")||'{"logs":[],"weights":{}}');
const dayNames=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const today=dayNames[new Date().getDay()];
document.getElementById("todayBadge").textContent=today;
function save(){localStorage.setItem("skyfit_v1",JSON.stringify(data))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
function exSvg(name){let kind=name.toLowerCase();let body=kind.includes("perna")||kind.includes("agach")||kind.includes("leg")||kind.includes("stiff")||kind.includes("panturr")||kind.includes("afundo")||kind.includes("hip")?"legs":kind.includes("costas")||kind.includes("puxada")||kind.includes("remada")||kind.includes("pullover")?"back":kind.includes("bíceps")||kind.includes("rosca")?"arm":"chest";let accent=body==="legs"?"#35d07f":body==="back"?"#39a9ff":body==="arm"?"#b875ff":"#ff5470";return `<svg viewBox="0 0 100 70"><g fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"><circle cx="50" cy="13" r="7" fill="${accent}" stroke="none"/><path d="M50 21v25M50 29l-17 12M50 29l17 12M50 46l-12 17M50 46l12 17"/><path d="M20 21h60M15 18v7M85 18v7"/></g></svg>`}
function card(ex,i,day){let w=data.weights[day+"_"+i]||{sets:[]};return `<div class="exercise"><div class="ex-top"><div class="ex-img">${exSvg(ex[0])}</div><div><div class="ex-name">${i+1}. ${ex[0]}</div><span class="tag">${ex[1]}</span></div></div><div class="presc">${ex[2]} séries • ${ex[3]} repetições</div><button class="btn secondary full open" onclick="openExercise('${day}',${i})">Registrar carga e repetições</button></div>`}
function home(){let logs=data.logs.length;let total=data.logs.reduce((a,l)=>a+l.volume,0);document.getElementById("app").innerHTML=`<section class="hero"><h1>Treine. Registre. Evolua.</h1><p>Seu plano de Hipertrofia com controle progressivo de cargas e repetições.</p><br><button class="btn" onclick="openWorkout('${workouts[today] ? today : 'Segunda'}')">Começar treino de hoje</button></section><div class="grid"><div class="stat"><b>${logs}</b><span>treinos registrados</span></div><div class="stat"><b>${Math.round(total)} kg</b><span>volume acumulado</span></div><div class="stat"><b>${Object.keys(data.weights).length}</b><span>exercícios registrados</span></div><div class="stat"><b>5x</b><span>treinos por semana</span></div></div><div class="section-title"><h2>Seu plano</h2></div>${Object.keys(workouts).map(d=>`<div class="day" onclick="openWorkout('${d}')"><div class="day-icon">${workouts[d].icon}</div><div><h3>${d} — ${workouts[d].title}</h3><p>${workouts[d].ex.length} exercícios</p></div><div class="arrow">›</div></div>`).join("")}<div class="day" style="opacity:.65"><div class="day-icon">😴</div><div><h3>Quinta e Domingo — Descanso</h3><p>Recuperação muscular</p></div></div>`}
function openWorkout(day){document.getElementById("app").innerHTML=`<button class="back" onclick="home()">‹ Voltar</button><h1 class="screen-title">${day} — ${workouts[day].title}</h1><p class="screen-sub">${workouts[day].ex.length} exercícios • foco em hipertrofia</p>${workouts[day].ex.map((e,i)=>card(e,i,day)).join("")}<button class="btn full" onclick="finishWorkout('${day}')">✓ Concluir treino</button>`}
function openExercise(day,i){let ex=workouts[day].ex[i], key=day+"_"+i, old=data.weights[key]||{sets:[]};let rows="";for(let s=0;s<ex[2];s++){let r=old.sets[s]||{};rows+=`<div class="setrow"><div class="setnum">${s+1}</div><input class="field kg" inputmode="decimal" placeholder="kg" value="${r.kg??''}"><input class="field reps" inputmode="numeric" placeholder="reps" value="${r.reps??''}"><button class="check ${r.done?'done':''}" onclick="this.classList.toggle('done')">✓</button></div>`}document.getElementById("app").innerHTML=`<button class="back" onclick="openWorkout('${day}')">‹ ${day}</button><h1 class="screen-title">${ex[0]}</h1><p class="screen-sub">${ex[1]} • ${ex[2]} séries • ${ex[3]} reps</p><div class="exercise"><div class="ex-img" style="width:100%;height:160px">${exSvg(ex[0])}</div><p class="muted">Imagem ilustrativa do padrão do exercício. Priorize técnica, amplitude segura e progressão gradual.</p></div><div class="progress-card"><b>Registrar séries</b><div class="inputs">${rows}</div></div><button class="btn full" onclick="saveExercise('${day}',${i})">Salvar registro</button>`}
function saveExercise(day,i){let rows=[...document.querySelectorAll(".setrow")],sets=rows.map(r=>({kg:parseFloat(r.querySelector(".kg").value)||0,reps:parseInt(r.querySelector(".reps").value)||0,done:r.querySelector(".check").classList.contains("done")}));data.weights[day+"_"+i]={sets,updated:new Date().toISOString()};save();toast("Registro salvo!");setTimeout(()=>openWorkout(day),450)}
function finishWorkout(day){let volume=0,sets=0;workouts[day].ex.forEach((e,i)=>{let w=data.weights[day+"_"+i];if(w)w.sets.forEach(s=>{volume+=(s.kg||0)*(s.reps||0);if(s.kg||s.reps)sets++})});data.logs.push({date:new Date().toISOString(),day,volume,sets});save();toast("Treino concluído e salvo!");setTimeout(()=>progress(),500)}
function progress(){let all=[];Object.entries(data.weights).forEach(([key,w])=>{let [day,i]=key.split("_");let ex=workouts[day]?.ex[+i];if(!ex)return;w.sets.forEach(s=>{if(s.kg>0&&s.reps>0)all.push({ex:ex[0],kg:s.kg,reps:s.reps,date:w.updated})})});let grouped={};all.forEach(x=>{grouped[x.ex]??=[];grouped[x.ex].push(x)});let cards=Object.entries(grouped).map(([name,arr])=>{arr.sort((a,b)=>new Date(a.date)-new Date(b.date));let max=Math.max(...arr.map(x=>x.kg));let last=arr[arr.length-1].kg;return `<div class="progress-card"><b>${name}</b><div class="grid" style="margin-top:10px"><div class="stat"><b>${last} kg</b><span>última carga</span></div><div class="stat"><b>${max} kg</b><span>maior carga</span></div></div><div class="chart">${chart(arr)}</div></div>`}).join("");document.getElementById("app").innerHTML=`<h1 class="screen-title">Meu progresso</h1><p class="screen-sub">Acompanhe sua evolução de carga.</p>${cards||'<div class="empty">Registre seus primeiros exercícios para começar a ver sua evolução.</div>'}<div class="section-title"><h2>Histórico de treinos</h2></div>${data.logs.slice().reverse().map(l=>`<div class="history"><b>${l.day} — ${new Date(l.date).toLocaleDateString('pt-BR')}</b><small>${l.sets} séries • ${Math.round(l.volume)} kg de volume</small></div>`).join("")}`}
function chart(arr){let vals=arr.map(x=>x.kg),min=Math.min(...vals),max=Math.max(...vals);let w=320,h=160,p=18;let pts=vals.map((v,i)=>{let x=p+(vals.length===1?0:i*(w-2*p)/(vals.length-1));let y=h-p-((v-min)/(max-min||1))*(h-2*p);return `${x},${y}`}).join(" ");return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#29465b"/><polyline points="${pts}" fill="none" stroke="#1595ff" stroke-width="4"/><circle cx="${p}" cy="${h-p-((vals[0]-min)/(max-min||1))*(h-2*p)}" r="4" fill="#1595ff"/>${vals.map((v,i)=>{let x=p+(vals.length===1?0:i*(w-2*p)/(vals.length-1));let y=h-p-((v-min)/(max-min||1))*(h-2*p);return `<circle cx="${x}" cy="${y}" r="4" fill="#fff"/>`}).join("")}</svg>`}
function treinos(){document.getElementById("app").innerHTML=`<h1 class="screen-title">Meus treinos</h1><p class="screen-sub">Escolha o dia e registre sua sessão.</p>${Object.keys(workouts).map(d=>`<div class="day" onclick="openWorkout('${d}')"><div class="day-icon">${workouts[d].icon}</div><div><h3>${d}</h3><p>${workouts[d].title}</p></div><div class="arrow">›</div></div>`).join("")}`}
function tab(t){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));t==="home"?home():t==="treinos"?treinos():progress()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));tab("home");
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
